[project]
name = "custom-answer-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49.0,<2",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "langchain>=0.3.25",
    "langchain-openai>=0.3.16",
    "langchain-community",
    "langchain-text-splitters",
    "pydantic-settings>=2.9.1",
    "redis>=5.2.1",
    "chainlit>=2.0.0",
    "pandas>=3.0.3",
    "numpy>=2.4.5",
    "python-multipart",
    "pypdf",
    "faiss-cpu",
    "fastembed",
    "trafilatura>=2.0.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "psycopg2-binary>=2.9.12",
    "sqlmodel>=0.0.38",
    "pgvector>=0.4.2",
    "jieba>=0.42.1",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
